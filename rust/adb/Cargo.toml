[package]
name = "interop-adb"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Independent asynchronous ADB host protocol and device services"

[features]
default = ["usb"]
usb = ["dep:nusb"]

[dependencies]
base64 = "0.23.1"
rand = "0.10.3"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha1 = { version = "0.11.0", features = ["oid"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26.6", default-features = false }
rustls-rustcrypto = { version = "=0.1.0-pre.0", default-features = false, features = ["std", "zeroize"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["std", "builder"] }
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
subtle = "2.6.1"
zeroize = { version = "1.9.1", features = ["alloc"] }
sha2 = { version = "0.11.1", features = ["oid"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "0.9.4", default-features = false, features = ["zeroize"] }
hkdf = "0.13.0"
signature = "3.0.0"
mdns-sd = "=0.21.7"
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "frame", "safe-encode", "safe-decode", "checked-decode"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std", "hash"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "windows", target_os = "macos"))'.dependencies]
nusb = { version = "0.2.9", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
