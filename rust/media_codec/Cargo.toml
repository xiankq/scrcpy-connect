[package]
name = "media-codec-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "media_codec_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]

[dependencies]
flutter_rust_bridge = "=2.13.0"

[build-dependencies]
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = 0
strip = "debuginfo"
panic = "abort"
incremental = false

