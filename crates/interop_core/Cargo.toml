[package]
name = "interop-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
interop-adb = { path = "../adb" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23.1"
sha2 = "0.11.1"
hex = "0.4.3"
subtle = "2.6.1"
bytes = "1"

[dev-dependencies]
tempfile = "3"
mdns-sd = "=0.21.6"
rsa = { version = "0.9.10", features = ["pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26.6", default-features = false }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["std", "zeroize"] }
socket2 = { version = "=0.6.5", features = ["all"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
