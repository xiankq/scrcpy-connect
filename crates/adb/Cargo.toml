[package]
name = "interop-adb"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Independent asynchronous ADB host protocol and device services"

[features]
default = ["usb"]
usb = ["dep:nusb"]

[dependencies]
base64 = "0.22.1"
rand = "0.8.5"
rsa = { version = "0.9.8", features = ["sha1", "sha2", "pem"] }
sha1 = { version = "0.10.6", features = ["oid"] }
thiserror = "2.0.12"
tokio = { version = "1.45", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.15", features = ["rt"] }
rustls = { version = "0.23.35", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26.4", default-features = false }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["std", "zeroize"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
subtle = "2.6.1"
zeroize = { version = "1.8.2", features = ["alloc"] }
sha2 = { version = "0.10.9", features = ["oid"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
hkdf = "0.12.4"
mdns-sd = "=0.21.2"
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "frame", "safe-encode", "safe-decode", "checked-decode"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std", "hash"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "windows", target_os = "macos"))'.dependencies]
nusb = { version = "0.2.8", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
tokio = { version = "1.45", features = ["full"] }
