include: package:flutter_lints/flutter.yaml

# Analyzer plugins are workspace-wide and must be enabled at its root.
plugins:
  riverpod_lint: 3.1.9

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - '**/build/**'
    - '**/.dart_tool/**'
    - app/android/**
    - app/ios/**
    - app/macos/**
    - app/windows/**
    - app/linux/**
    - build/**
