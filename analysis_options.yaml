include: package:flutter_lints/flutter.yaml

# analyzer 插件作用于整个工作区，必须在根目录启用。
plugins:
  riverpod_lint: 3.2.0

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - '**/build/**'
    - '**/.dart_tool/**'
    - app/android/**
    - app/ios/**
    - app/macos/**
    - app/windows/**
    - app/linux/**
    - build/**
