name: connect_workspace
description: Repository tooling and shared dependency workspace.
publish_to: none
environment:
  sdk: ^3.13.5
workspace:
  - app
  - packages/design_system
  - packages/interop_bridge
dev_dependencies:
  ffi: 2.2.0
  archive: 3.6.1
  args: 2.7.0
  crypto: 3.0.7
  path: 1.9.1
  xml: 7.1.0
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_lint: 3.1.9
  hooks_riverpod: ^3.4.3
  path_provider: ^2.1.6
  interop_bridge:
    path: packages/interop_bridge
