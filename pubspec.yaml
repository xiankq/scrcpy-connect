name: connect_workspace
description: Repository tooling and shared dependency workspace.
publish_to: none
environment:
  sdk: ^3.13.5
workspace:
  - app
  - packages/design_system
  - packages/device_runtime
  - packages/media_codec
  - packages/flutter_adb
  - packages/device_protocol
  - packages/runtime_diagnostics
  - packages/device_connections
  - packages/device_files
  - packages/scrcpy_client
  - packages/device_preferences
dev_dependencies:
  device_protocol:
    path: packages/device_protocol
  runtime_diagnostics:
    path: packages/runtime_diagnostics
  device_connections:
    path: packages/device_connections
  device_files:
    path: packages/device_files
  scrcpy_client:
    path: packages/scrcpy_client
  ffi: 2.2.0
  archive: 4.5.2
  args: 2.7.0
  crypto: 3.0.7
  path: 1.9.1
  xml: 7.1.0
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_lint: 3.1.9
  hooks_riverpod: ^3.4.3
  path_provider: ^2.1.6
  device_runtime:
    path: packages/device_runtime
