name: scrcpy_connect
description: 邻接：通过 Rust ADB 使用另一台 Android 手机。
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: packages/design_system
  interop_bridge:
    path: packages/interop_bridge
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  lucide_icons_flutter: ^4.0.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  video_player: ^2.14.1
  fvp: 0.39.1
  qr_flutter: ^4.1.0
  go_router: 18.1.0
  riverpod_annotation: 4.0.7
  flutter_local_notifications: 22.3.2
dev_dependencies:
  archive: 3.6.1
  args: 2.7.0
  crypto: 3.0.7
  path: 1.9.1
  xml: 7.1.0
  flutter_rust_bridge: 2.13.0
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: 4.5.0
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  build_runner: 2.16.2
flutter:
  uses-material-design: true

workspace:
  - packages/design_system
  - packages/interop_bridge

dependency_overrides:
  fvp:
    path: third_party/fvp
