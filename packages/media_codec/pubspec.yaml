name: media_codec
description: Packet-driven low-latency video and PCM output for Flutter.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'
dependencies:
  ffi: ^2.2.0
  flutter_rust_bridge: 2.13.0
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.scrcpyconnect.media_codec
        pluginClass: MediaCodecPlugin
      ios:
        pluginClass: MediaCodecPlugin
      macos:
        pluginClass: MediaCodecPlugin
      linux:
        pluginClass: MediaCodecPlugin
      windows:
        pluginClass: MediaCodecPluginCApi
