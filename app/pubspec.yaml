name: scrcpy_connect
description: 邻接：通过 Rust ADB 使用另一台 Android 手机。
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.13.5
dependencies:
  adb:
    path: ../packages/adb
  scrcpy:
    path: ../packages/scrcpy
  crypto: 3.0.7
  uuid: 4.6.0
  multicast_dns: ^0.3.3+1
  open_filex: ^5.0.0
  flutter:
    sdk: flutter
  design_system:
    path: ../packages/design_system
  liquid_glass_widgets: ^1.15.0
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  lucide_icons_flutter: ^4.0.1
  path_provider: ^2.1.6
  path: 1.9.1
  file_picker: ^13.2.0
  share_plus: ^13.3.1
  media_codec:
    path: ../packages/media_codec
  qr_flutter: ^4.1.0
  go_router: ^18.1.1
  riverpod_annotation: 4.0.7
  flutter_local_notifications: ^22.3.3
  package_info_plus: 10.2.2
dev_dependencies:
  path_provider_platform_interface: 2.1.3
  archive: 4.5.2
  args: 2.7.0
  xml: 7.1.0
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.5.2
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  build_runner: 2.16.2
flutter:
  config:
    enable-swift-package-manager: false
  assets:
    - assets/servers/
  uses-material-design: true
