[workspace]
resolver = "3"
members = ["crates/adb", "crates/interop_core", "crates/interop_bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

# Test binaries link the full core. Line tables keep panic locations readable
# without duplicating type and variable debug info for every test target.
[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
