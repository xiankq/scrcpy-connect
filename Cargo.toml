[workspace]
resolver = "3"
members = [
  "rust/adb", "rust/adb/api", "rust/adb/bridge",
  "rust/scrcpy", "rust/scrcpy/api", "rust/scrcpy/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

# 测试二进制会链接完整核心；行号表保留 panic 位置，
# 避免每个测试目标重复写入类型和变量调试信息。
[profile.dev]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
