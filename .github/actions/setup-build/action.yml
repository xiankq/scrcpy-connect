name: Set up build tools
description: Prepare the locked Flutter workspace and native build dependencies
inputs:
  native:
    description: Also install tools for compiling native code
    default: 'true'
runs:
  using: composite
  steps:
    - if: inputs.native == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - if: inputs.native == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake libclang-dev libdrm-dev libepoxy-dev libgtk-3-dev libva-dev nasm pkg-config
    - if: inputs.native == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        command -v nasm || brew install nasm
    - if: inputs.native == 'true' && runner.os == 'Windows'
      id: msys2
      uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
      with:
        msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'UCRT64' }}
        install: make diffutils
    - if: inputs.native == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        (Join-Path $env:MSYS2_LOCATION 'usr/bin') >> $env:GITHUB_PATH
        "LIBCLANG_PATH=$(Join-Path $env:ProgramFiles 'LLVM/bin')" >> $env:GITHUB_ENV
        if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:ChocolateyInstall 'bin') >> $env:GITHUB_PATH
        }
    - if: inputs.native == 'true'
      shell: bash
      run: |
        python -m pip install meson==1.12.1 ninja==1.13.2
        rustup show active-toolchain
    # Flutter 3.50.1 has native ARM64 engines and Dart SDKs on these hosts,
    # but the stable archive indexes only advertise x64 desktop bundles.
    - if: runner.arch == 'ARM64' && runner.os != 'macOS'
      shell: bash
      env:
        FLUTTER_HOST_ARCH: arm64
      run: |
        sdk="$RUNNER_TEMP/flutter-arm64"
        if [[ "$RUNNER_OS" == Windows ]]; then sdk="$(cygpath -u "$sdk")"; fi
        git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$sdk"
        test "$(git -C "$sdk" rev-parse HEAD)" = ae9b586f34a8443573f82ef57c3bf914a908cbf7
        "$sdk/bin/flutter" --version
        if [[ "$RUNNER_OS" == Windows ]]; then sdk="$(cygpath -w "$sdk")"; fi
        echo "$sdk/bin" >> "$GITHUB_PATH"
    - if: runner.arch != 'ARM64' || runner.os == 'macOS'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.50.1'
        channel: stable
        cache: true
    - shell: bash
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
      run: flutter pub get --enforce-lockfile
