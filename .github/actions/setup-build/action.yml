name: Set up build tools
description: Prepare the locked Flutter workspace and native build dependencies
inputs:
  native:
    description: Also install tools for compiling native code
    default: 'true'
  android:
    description: Install Android host tools in place of Linux desktop libraries
    default: 'false'
  media-profile:
    description: Platform, SDK and architecture of the pinned media build
    default: ''
  media-cache-path:
    description: Directory containing the compiled media libraries and their receipts
    default: .dart_tool/media_codec/ffmpeg
  resolve-packages:
    description: Restore the locked Dart and Flutter dependencies
    default: 'true'
runs:
  using: composite
  steps:
    - if: inputs.native == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Install Ubuntu build dependencies
      if: inputs.native == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        ANDROID_BUILD: ${{ inputs.android }}
      run: |
        if [[ "$RUNNER_ARCH" == X64 ]]; then
          sudo sed -i -E 's@mirror\+file:/etc/apt/apt-mirrors\.txt|https?://[[:alnum:].-]+\.ec2\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' /etc/apt/sources.list.d/ubuntu.sources
        fi
        printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'Acquire::Languages "none";' \
          | sudo tee /etc/apt/apt.conf.d/99-interconnect-ci >/dev/null
        packages=(build-essential nasm pkg-config)
        if [[ "$ANDROID_BUILD" != true ]]; then
          packages+=(clang cmake libclang-dev libdrm-dev libepoxy-dev libgtk-3-dev libva-dev)
        fi
        timeout 4m sudo apt-get update -o APT::Update::Error-Mode=any
        timeout 4m sudo apt-get install -y --no-install-recommends "${packages[@]}"
    - if: inputs.native == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        command -v nasm || brew install nasm
    - if: inputs.native == 'true' && runner.os == 'Linux' && runner.arch == 'ARM64'
      shell: bash
      run: |
        export RUSTUP_HOME="$RUNNER_TEMP/interconnect-rustup"
        toolchain="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
        rustup toolchain install "$toolchain" --profile minimal
        printf 'RUSTUP_HOME=%s\nRUSTUP_TOOLCHAIN=%s\n' "$RUSTUP_HOME" "$toolchain" >> "$GITHUB_ENV"
    - if: inputs.native == 'true' && runner.os == 'Windows'
      id: msys2
      uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
      with:
        msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'UCRT64' }}
        install: make diffutils
    - if: inputs.native == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $msysBin = Join-Path $env:MSYS2_LOCATION 'usr\bin'
        $msysBin >> $env:GITHUB_PATH
        "MEDIA_CODEC_MSYS2_BIN=$msysBin" >> $env:GITHUB_ENV
        $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
        $llvmBin >> $env:GITHUB_PATH
        "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
        if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:ChocolateyInstall 'bin') >> $env:GITHUB_PATH
        }
    - if: inputs.native == 'true'
      shell: bash
      run: |
        python -m pip install meson==1.12.1 ninja==1.13.2
        rustup show active-toolchain
    # Flutter 3.50.1 has native ARM64 engines and Dart SDKs on these hosts,
    # but the stable archive indexes only advertise x64 desktop bundles.
    - if: runner.arch == 'ARM64' && runner.os != 'macOS'
      shell: bash
      env:
        FLUTTER_HOST_ARCH: arm64
      run: |
        sdk="$RUNNER_TEMP/flutter-arm64"
        if [[ "$RUNNER_OS" == Windows ]]; then sdk="$(cygpath -u "$sdk")"; fi
        git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$sdk"
        test "$(git -C "$sdk" rev-parse HEAD)" = ae9b586f34a8443573f82ef57c3bf914a908cbf7
        "$sdk/bin/flutter" --version
        if [[ "$RUNNER_OS" == Windows ]]; then sdk="$(cygpath -w "$sdk")"; fi
        echo "$sdk/bin" >> "$GITHUB_PATH"
    - if: runner.arch != 'ARM64' || runner.os == 'macOS'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.50.1'
        channel: stable
        cache: true
    - name: Restore locked workspace dependencies
      if: inputs.resolve-packages == 'true'
      shell: bash
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
      run: flutter pub get --enforce-lockfile
    - name: Identify hosted runner image
      id: image
      if: inputs.media-profile != ''
      shell: bash
      run: printf 'version=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
    - name: Cache pinned media libraries
      if: inputs.media-profile != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.media-cache-path }}
        key: media-${{ runner.os }}-${{ runner.arch }}-${{ inputs.media-profile }}-${{ steps.image.outputs.version }}-${{ hashFiles('packages/media_codec/third_party/**', 'packages/media_codec/tool/**', 'packages/media_codec/darwin/build_native.sh') }}
