name: Checks

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Install the repository Rust toolchain and pinned FRB tools
        run: |
          rustup show
          cargo install flutter_rust_bridge_codegen --version =2.13.0 --locked
          cargo install cargo-expand --version =1.0.127 --locked
      - name: Generation, analysis, tests, design lint, and Android APK gates
        run: ./tool/check.sh --android
      - name: Retain the verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  host-apps:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-15
            artifact: build/verified/ios-release.tar.gz
          - platform: macos
            runner: macos-15
            artifact: build/verified/macos-release.tar.gz
          - platform: windows
            runner: windows-2025-vs2026
            artifact: build/verified/windows-release.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      # Use the native shell on Windows; check.sh also runs Linux-only probes.
      # The application's native-assets hook invokes this pinned Rust toolchain.
      - name: Install the repository Rust toolchain
        run: rustup show
      - name: Install Apple Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - name: Resolve the locked Flutter workspace
        run: flutter pub get --enforce-lockfile
      - name: Build and inspect the final host application
        run: dart tool/build_host.dart ${{ matrix.platform }}
      - name: Retain the verified application bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release-application
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
