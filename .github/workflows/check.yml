name: Checks

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Install the repository Rust toolchain
        run: rustup show
      - name: Generation, analysis, tests, design lint, and Android APK gates
        run: ./tool/check.sh --android
      - name: Retain the verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/connect/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
