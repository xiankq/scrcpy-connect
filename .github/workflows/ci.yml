name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - uses: ./.github/actions/setup-build
        with:
          media-profile: linux-x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Cache the binding generator
        id: generator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: binding-generator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/ci.yml') }}
      - name: Install the binding generator
        if: steps.generator.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-expand --version 1.0.127
          cargo install --locked flutter_rust_bridge_codegen --version 2.13.0
      - name: Build pinned media dependencies
        run: python3 packages/media_codec/tool/build_ffmpeg.py --platform linux --arch x64
      - name: Check generated files, analyze and test
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: ./scripts/check.sh
