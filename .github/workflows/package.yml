name: Packages

on:
  push:
    branches: [codex/package-preview]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      macos:
        description: Publish Developer ID signed and notarized macOS disk images
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: x64, runner: ubuntu-24.04}
          - {platform: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {platform: windows, arch: x64, runner: windows-2025}
          - {platform: windows, arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - if: matrix.platform == 'linux'
        name: Install Linux package tools
        run: sudo apt-get install -y file rpm desktop-file-utils squashfs-tools ${{ matrix.arch == 'arm64' && 'adb' || '' }}
      - if: matrix.platform == 'windows'
        name: Install the pinned Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.5.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne 'fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1') {
            throw 'Inno Setup SHA256 mismatch'
          }
          $inno = Join-Path $env:RUNNER_TEMP 'inno'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=`"$inno`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed: $($install.ExitCode)" }
          $inno >> $env:GITHUB_PATH
      - name: Build verified desktop packages
        shell: bash
        env:
          UPDATE_FEED: ${{ inputs.release && format('https://github.com/{0}/releases/latest/download/release-feed.json', github.repository) || '' }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: dart scripts/build_host.dart "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCH" --installers --update-feed "$UPDATE_FEED"
      - if: matrix.platform == 'windows'
        name: Verify silent install and uninstall
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          $arch = $env:PACKAGE_ARCH
          $program = Join-Path $env:RUNNER_TEMP 'interconnect-install-check'
          $setup = Resolve-Path "build/verified/windows-$arch-release-setup.exe"
          $original = "app/build/windows/$arch/runner/Release/Interconnect.exe"
          $result = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$program`"" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Client installation failed: $($result.ExitCode)" }
          if ((Get-FileHash "$program/Interconnect.exe").Hash -ne (Get-FileHash $original).Hash) {
            throw 'Installer payload differs from the verified binary'
          }
          $result = Start-Process "$program/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path "$program/Interconnect.exe")) {
            throw 'Client uninstall failed'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/verified/${{ matrix.platform }}-${{ matrix.arch }}-release*
          if-no-files-found: error
          compression-level: 0

  apple:
    if: '!inputs.release || inputs.macos'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.release && '[{"platform":"macos","arch":"x64"},{"platform":"macos","arch":"arm64"}]' || '[{"platform":"macos","arch":"x64"},{"platform":"macos","arch":"arm64"},{"platform":"ios","arch":"arm64"},{"platform":"ios","arch":"arm64","simulator":true}]') }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: ${{ inputs.release && 'release' || 'package-preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build and package Apple clients
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_SIMULATOR: ${{ matrix.simulator && 'true' || 'false' }}
          PUBLIC_MACOS: ${{ inputs.release }}
          UPDATE_FEED: ${{ inputs.release && format('https://github.com/{0}/releases/latest/download/release-feed.json', github.repository) || '' }}
          MACOS_CERTIFICATE_BASE64: ${{ inputs.release && secrets.MACOS_CERTIFICATE_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ inputs.release && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_NOTARY_KEY_BASE64: ${{ inputs.release && secrets.MACOS_NOTARY_KEY_BASE64 || '' }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ vars.MACOS_NOTARY_ISSUER }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.release && vars.MACOS_SIGNING_IDENTITY || '' }}
        run: |
          flags=()
          if [[ "$PACKAGE_PLATFORM" == macos ]]; then flags=(--installers); fi
          if [[ "$PACKAGE_SIMULATOR" == true ]]; then flags=(--simulator); fi
          if [[ "$PUBLIC_MACOS" == true ]]; then
            source scripts/macos_ci_signing.sh
          fi
          dart scripts/build_host.dart "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCH" "${flags[@]}" --update-feed "$UPDATE_FEED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}${{ matrix.simulator && '-simulator' || '' }}-${{ matrix.arch }}
          path: build/verified/${{ matrix.platform }}${{ matrix.simulator && '-simulator' || '' }}-${{ matrix.arch }}-${{ matrix.simulator && 'debug' || 'release' }}.*
          if-no-files-found: error
          compression-level: 0

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ inputs.release && 'release' || 'package-preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install the Android Rust targets
        run: rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
      - name: Build and verify the Android package set
        env:
          PUBLIC_ANDROID: ${{ inputs.release }}
          ANDROID_SIGNING_STORE_BASE64: ${{ inputs.release && secrets.ANDROID_SIGNING_STORE_BASE64 || '' }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ inputs.release && secrets.ANDROID_SIGNING_STORE_PASSWORD || '' }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ inputs.release && secrets.ANDROID_SIGNING_KEY_ALIAS || '' }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ inputs.release && secrets.ANDROID_SIGNING_KEY_PASSWORD || '' }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
          UPDATE_FEED: ${{ inputs.release && format('https://github.com/{0}/releases/latest/download/release-feed.json', github.repository) || '' }}
        run: |
          mode=debug
          flags=()
          if [[ "$PUBLIC_ANDROID" == true ]]; then
            : "${ANDROID_SIGNING_STORE_BASE64:?Missing Android keystore}"
            : "${ANDROID_SIGNER_SHA256:?Missing Android certificate fingerprint}"
            umask 077
            export ANDROID_SIGNING_STORE_FILE="$(mktemp "$RUNNER_TEMP/interconnect-signing.XXXXXX")"
            trap 'rm -f "$ANDROID_SIGNING_STORE_FILE"' EXIT
            printf '%s' "$ANDROID_SIGNING_STORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
            unset ANDROID_SIGNING_STORE_BASE64
            mode=release
            flags=(--update-feed "$UPDATE_FEED" --signer-sha256 "$ANDROID_SIGNER_SHA256")
          fi
          mkdir -p build/verified
          for target in 'arm64:arm64-v8a' 'arm:armeabi-v7a' 'x64:x86_64' 'universal:universal'; do
            dart scripts/android.dart build --mode "$mode" --abi "${target%:*}" --no-pub "${flags[@]}"
            mv "app/build/app/outputs/flutter-apk/app-$mode.apk" "build/verified/android-${target#*:}-$mode.apk"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-android
          path: build/verified/android-*.apk
          if-no-files-found: error
          compression-level: 0
