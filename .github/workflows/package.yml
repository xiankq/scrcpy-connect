name: Packages

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-build/**'
      - '.github/workflows/package.yml'
      - '.fvmrc'
      - 'app/android/**/*.gradle.kts'
      - 'app/android/gradle/wrapper/**'
      - 'app/linux/CMakeLists.txt'
      - 'app/linux/*.xml'
      - 'app/windows/CMakeLists.txt'
      - 'packages/adb/lib/src/adb_host.dart'
      - 'packages/media_codec/darwin/build_native.sh'
      - 'packages/media_codec/tool/**'
      - 'packages/media_codec/third_party/**'
      - 'pubspec.lock'
      - 'rust-toolchain.toml'
      - 'scripts/android.dart'
      - 'scripts/apple_bundle_resources.sh'
      - 'scripts/build_host.dart'
      - 'scripts/installer_windows.iss'
      - 'scripts/src/packaging*'
      - 'scripts/package_*'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      preview:
        description: Use the public Android signing key without enabling stable updates
        type: boolean
        default: false
      macos:
        description: Publish Developer ID signed and notarized macOS disk images
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: x64, runner: ubuntu-24.04}
          - {platform: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {platform: windows, arch: x64, runner: windows-2025}
          - {platform: windows, arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          media-profile: ${{ matrix.platform }}-${{ matrix.arch }}
      - if: matrix.platform == 'linux'
        name: Install Linux package tools
        run: timeout 4m sudo apt-get install -y --no-install-recommends adb appstream file rpm desktop-file-utils squashfs-tools
      - if: matrix.platform == 'windows'
        name: Install the pinned Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.5.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne 'fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1') {
            throw 'Inno Setup SHA256 mismatch'
          }
          $inno = Join-Path $env:RUNNER_TEMP 'inno'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=`"$inno`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed: $($install.ExitCode)" }
          $inno >> $env:GITHUB_PATH
      - name: Build verified desktop packages
        shell: bash
        env:
          UPDATE_FEED: ${{ inputs.release && format('https://github.com/{0}/releases/latest/download/release-feed.json', github.repository) || '' }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: dart scripts/build_host.dart "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCH" --installers --update-feed "$UPDATE_FEED"
      - if: matrix.platform == 'linux'
        name: Verify DEB install and uninstall
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          prefix="build/verified/linux-$PACKAGE_ARCH-release"
          sudo dpkg --install "$prefix.deb"
          cmp /usr/bin/interconnect "app/build/linux/$PACKAGE_ARCH/release/bundle/interconnect"
          sudo dpkg --remove interconnect
          test ! -e /usr/bin/interconnect
      - if: matrix.platform == 'windows'
        name: Verify silent install and uninstall
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          $arch = $env:PACKAGE_ARCH
          $program = Join-Path $env:RUNNER_TEMP 'interconnect-install-check'
          $setup = Resolve-Path "build/verified/windows-$arch-release-setup.exe"
          $original = "app/build/windows/$arch/runner/Release/Interconnect.exe"
          $result = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$program`"" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Client installation failed: $($result.ExitCode)" }
          if ((Get-FileHash "$program/Interconnect.exe").Hash -ne (Get-FileHash $original).Hash) {
            throw 'Installer payload differs from the verified binary'
          }
          $result = Start-Process "$program/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path "$program/Interconnect.exe")) {
            throw 'Client uninstall failed'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/verified/${{ matrix.platform }}-${{ matrix.arch }}-release*
          if-no-files-found: error
          compression-level: 0

  apple:
    if: '!inputs.release || inputs.macos'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.release && '[{"platform":"macos","arch":"x64"},{"platform":"macos","arch":"arm64"}]' || '[{"platform":"macos","arch":"x64"},{"platform":"macos","arch":"arm64"},{"platform":"ios","arch":"arm64"},{"platform":"ios","arch":"arm64","simulator":true}]') }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: ${{ inputs.release && 'release' || 'package-preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          media-profile: ${{ matrix.platform }}${{ matrix.simulator && '-simulator' || '' }}-${{ matrix.arch }}
          media-cache-path: ${{ matrix.platform == 'macos' && 'app/build/macos/Build/Products/Release/media_codec_ffmpeg' || matrix.simulator && 'app/build/ios/Debug-iphonesimulator/media_codec_ffmpeg' || 'app/build/ios/Release-iphoneos/media_codec_ffmpeg' }}
      - name: Install Apple Rust targets
        env:
          RUST_TARGET: ${{ matrix.platform == 'ios' && (matrix.simulator && 'aarch64-apple-ios-sim' || 'aarch64-apple-ios') || (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') }}
        run: rustup target add "$RUST_TARGET"
      - name: Build and package Apple clients
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_SIMULATOR: ${{ matrix.simulator && 'true' || 'false' }}
          PUBLIC_MACOS: ${{ inputs.release }}
          UPDATE_FEED: ${{ inputs.release && format('https://github.com/{0}/releases/latest/download/release-feed.json', github.repository) || '' }}
          MACOS_CERTIFICATE_BASE64: ${{ inputs.release && secrets.MACOS_CERTIFICATE_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ inputs.release && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_NOTARY_KEY_BASE64: ${{ inputs.release && secrets.MACOS_NOTARY_KEY_BASE64 || '' }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ vars.MACOS_NOTARY_ISSUER }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.release && vars.MACOS_SIGNING_IDENTITY || '' }}
        run: |
          flags=()
          if [[ "$PACKAGE_PLATFORM" == macos ]]; then flags=(--installers); fi
          if [[ "$PACKAGE_SIMULATOR" == true ]]; then flags=(--simulator); fi
          if [[ "$PUBLIC_MACOS" == true ]]; then
            source scripts/macos_ci_signing.sh
          fi
          dart scripts/build_host.dart "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCH" "${flags[@]}" --update-feed "$UPDATE_FEED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}${{ matrix.simulator && '-simulator' || '' }}-${{ matrix.arch }}
          path: build/verified/${{ matrix.platform }}${{ matrix.simulator && '-simulator' || '' }}-${{ matrix.arch }}-${{ matrix.simulator && 'debug' || 'release' }}.*
          if-no-files-found: error
          compression-level: 0

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ (inputs.release || inputs.preview) && 'release' || 'package-preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          android: 'true'
          media-profile: android-ndk28
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Android dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle.properties', 'app/android/gradle/wrapper/gradle-wrapper.properties', '.fvmrc', 'pubspec.lock') }}
      - name: Install Android SDK components
        run: |
          sdkmanager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          ndk_version=28.2.13676358
          # Reclaim space on the disposable runner before building the native SDKs.
          sudo rm -rf /usr/share/dotnet "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator"
          for directory in "$ANDROID_HOME"/ndk/*; do
            if [[ -d "$directory" && "${directory##*/}" != "$ndk_version" ]]; then
              "$sdkmanager" --uninstall "ndk;${directory##*/}"
            fi
          done
          "$sdkmanager" 'platforms;android-36' 'platforms;android-37.0' 'build-tools;37.0.0' "ndk;$ndk_version" 'cmake;3.22.1'
          ndk="$ANDROID_HOME/ndk/$ndk_version"
          printf 'ANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\nANDROID_NDK=%s\n' "$ndk" "$ndk" "$ndk" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE"
      - name: Install the Android Rust targets
        run: rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
      - name: Build and verify the Android package set
        env:
          PUBLIC_ANDROID: ${{ inputs.release || inputs.preview }}
          ANDROID_SIGNING_STORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
          UPDATE_FEED: ${{ inputs.release && format('https://github.com/{0}/releases/latest/download/release-feed.json', github.repository) || '' }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/interconnect-cargo-target
        run: |
          set -o pipefail
          mode=debug
          flags=()
          if [[ "$PUBLIC_ANDROID" == true ]]; then
            : "${ANDROID_SIGNING_STORE_BASE64:?Missing Android keystore}"
            : "${ANDROID_SIGNER_SHA256:?Missing Android certificate fingerprint}"
            umask 077
            ANDROID_SIGNING_STORE_FILE="$(mktemp "$RUNNER_TEMP/interconnect-signing.XXXXXX")"
            export ANDROID_SIGNING_STORE_FILE
            trap 'rm -f "$ANDROID_SIGNING_STORE_FILE"' EXIT
            printf '%s' "$ANDROID_SIGNING_STORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
            unset ANDROID_SIGNING_STORE_BASE64
            mode=release
            flags=(--update-feed "$UPDATE_FEED" --signer-sha256 "$ANDROID_SIGNER_SHA256")
          fi
          log="$RUNNER_TEMP/android-build.log"
          if ! dart scripts/android.dart build --mode "$mode" --abi all --no-pub "${flags[@]}" 2>&1 | tee "$log"; then
            grep -Eq 'Received status code (429|50[234]) from server' "$log" || exit 1
            echo '::warning title=Android dependencies::Gradle dependency repository returned a temporary HTTP error. Retrying in 45 seconds.'
            sleep 45
            dart scripts/android.dart build --mode "$mode" --abi all --no-pub "${flags[@]}"
          fi
          mkdir -p build/verified
          outputs=app/build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "$outputs/app-$abi-$mode.apk" "build/verified/android-$abi-$mode.apk"
          done
          mv "$outputs/app-$mode.apk" "build/verified/android-universal-$mode.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-android
          path: build/verified/android-*.apk
          if-no-files-found: error
          compression-level: 0
