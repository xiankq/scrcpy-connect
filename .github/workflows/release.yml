name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      preview: ${{ steps.channel.outputs.preview }}
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit on main
        id: revision
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check that publishing is enabled for the tag
        id: channel
        env:
          ENABLE_PREVIEW: ${{ vars.PUBLIC_PREVIEWS_ENABLED }}
          ENABLE_STABLE: ${{ vars.PUBLIC_RELEASES_ENABLED }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ -preview\.[1-9][0-9]*$ ]]; then
            [[ "$ENABLE_PREVIEW" == true ]] || { echo 'Public previews are disabled.' >&2; exit 1; }
            echo 'preview=true' >> "$GITHUB_OUTPUT"
          else
            [[ "$ENABLE_STABLE" == true ]] || { echo 'Stable releases are disabled.' >&2; exit 1; }
            echo 'preview=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-build
        with:
          native: 'false'
      - name: Check the tag, license and release notes
        run: dart scripts/release.dart --tag "$GITHUB_REF_NAME"

  package:
    needs: preflight
    uses: ./.github/workflows/package.yml
    with:
      release: ${{ needs.preflight.outputs.preview == 'false' }}
      preview: ${{ needs.preflight.outputs.preview == 'true' }}
      macos: ${{ vars.MACOS_RELEASE_ENABLED == 'true' }}
    secrets: inherit

  # The push to main already started CI alongside the tag's package matrix.
  verify-main-ci:
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: bash scripts/wait_for_main_ci.sh "$GITHUB_REPOSITORY" "$SOURCE_COMMIT"

  publish:
    needs: [preflight, verify-main-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          native: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: build/downloads
      - name: Assemble and checksum the release files
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MACOS: ${{ vars.MACOS_RELEASE_ENABLED }}
          PREVIEW: ${{ needs.preflight.outputs.preview }}
        run: |
          macos=()
          if [[ "$PUBLISH_MACOS" == true ]]; then macos=(--macos); fi
          previous=()
          if [[ "$PREVIEW" == false ]]; then
            previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
            if [[ -n "$previous_tag" ]]; then
              previous_asset="$(gh release view "$previous_tag" --json assets --jq '.assets[].name | select(. == "release-feed.json")')"
              if [[ -n "$previous_asset" ]]; then
                gh release download "$previous_tag" --pattern release-feed.json --dir "$RUNNER_TEMP"
                previous=(--previous-feed "$RUNNER_TEMP/release-feed.json")
              fi
            fi
          fi
          python3 scripts/release_media_source.py build/downloads/release-media-source.tar.gz
          dart scripts/release.dart --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --packages build/downloads --output build/release --notes "$RUNNER_TEMP/release-notes.md" "${previous[@]}" "${macos[@]}"
      - name: Publish after uploading the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ needs.preflight.outputs.preview }}
        run: bash scripts/publish_release.sh build/release "$RUNNER_TEMP/release-notes.md"
